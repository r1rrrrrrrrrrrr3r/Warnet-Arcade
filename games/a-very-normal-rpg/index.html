<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Very Normal RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal">
    <div class="titlebar"><span>a-very-normal-rpg.exe</span><span>v3.0</span></div>
    <div id="output" class="output"></div>
    <div class="input-row">
      <span class="prompt-symbol">&gt;</span>
      <input id="command-input" type="text" autofocus placeholder="type a command and press enter" autocomplete="off">
    </div>
  </div>

<!-- data modules load first (plain scripts, not ES modules, so this still
     works when opened directly via file:// with no local server) -->
<script src="data/enemies.js"></script>
<script src="data/items.js"></script>
<script src="data/skills.js"></script>
<script src="data/allies.js"></script>
<script src="data/events.js"></script>
<script src="game.js"></script>
</body>
</html>
